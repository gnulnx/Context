name: Package

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip

      - name: Install packaging tools
        run: python -m pip install --upgrade build ruff twine

      - name: Lint
        run: python -m ruff check src tests

      - name: Build distributions
        run: python -m build

      - name: Validate distributions
        run: python -m twine check --strict dist/*

      - name: Test installed wheel
        run: |
          python -m pip install dist/*.whl pytest
          python -m pytest -q

      - name: Test real LaunchAgent lifecycle
        if: runner.os == 'macOS'
        env:
          BLCTX_LAUNCHD_TEST: "1"
        run: python -m pytest -q tests/test_launchd_service.py::test_real_launchd_lifecycle

      - name: Inspect distribution contents
        run: |
          python -m zipfile --list dist/*.whl
          tar --list --file dist/*.tar.gz
