name: Package

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm, macos-latest]
        python: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      - name: Install packaging tools
        run: python -m pip install --upgrade build ruff twine

      - name: Lint
        run: python -m ruff check src tests

      - name: Build distributions
        run: python -m build

      - name: Validate distributions
        run: python -m twine check --strict dist/*

      - name: Test installed wheel
        run: |
          python -m pip install dist/*.whl pytest
          python -m pip check
          python -m pytest -q -ra

      - name: Test real systemd lifecycle
        if: runner.os == 'Linux' && matrix.python == '3.13'
        env:
          BLCTX_SYSTEMD_TEST: "1"
        run: |
          export XDG_RUNTIME_DIR="/run/user/$(id -u)"
          export DBUS_SESSION_BUS_ADDRESS="unix:path=$XDG_RUNTIME_DIR/bus"
          systemctl --user show-environment >/dev/null
          python -m pytest -q -ra tests/test_service.py::test_real_systemd_lifecycle

      - name: Test real CPU embeddings
        if: runner.os == 'Linux' && matrix.python == '3.13'
        env:
          BLCTX_INDEX_TEST: "1"
        run: python -m pytest -q -ra tests/test_embedding.py::test_real_model_offline_lifecycle

      - name: Test real LaunchAgent lifecycle
        if: runner.os == 'macOS'
        env:
          BLCTX_LAUNCHD_TEST: "1"
        run: python -m pytest -q tests/test_launchd_service.py::test_real_launchd_lifecycle

      - name: Inspect distribution contents
        run: |
          python -m zipfile --list dist/*.whl
          tar --list --file dist/*.tar.gz

  debian:
    name: Debian ${{ matrix.release }} (${{ matrix.os }})
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm]
        release: [bookworm, trixie]
    runs-on: ${{ matrix.os }}
    container: debian:${{ matrix.release }}-slim

    steps:
      - name: Install Debian Python and test prerequisites
        run: |
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates git python3 python3-venv systemd
          python3 -m venv /opt/context-venv
          useradd --create-home context-test

      - name: Check out repository
        uses: actions/checkout@v7

      - name: Build and validate distributions with Debian Python
        run: |
          /opt/context-venv/bin/python -m pip install --upgrade build twine
          /opt/context-venv/bin/python -m build
          /opt/context-venv/bin/python -m twine check --strict dist/*
          /opt/context-venv/bin/python -m pip install dist/*.whl pytest
          /opt/context-venv/bin/python -m pip check

      - name: Test installed wheel as an unprivileged user
        run: runuser -u context-test -- /opt/context-venv/bin/python -m pytest -q -ra -p no:cacheprovider

      - name: Test real CPU embeddings as an unprivileged user
        env:
          BLCTX_INDEX_TEST: "1"
        run: runuser -u context-test -- /opt/context-venv/bin/python -m pytest -q -ra -p no:cacheprovider tests/test_embedding.py::test_real_model_offline_lifecycle
