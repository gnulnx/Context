<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 480" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #0d1117; }
      .card { fill: #161b22; stroke: #30363d; stroke-width: 1.5; rx: 12px; }
      .subcard { fill: #21262d; stroke: #30363d; stroke-width: 1; rx: 8px; }
      .accent-blue { stroke: #58a6ff; stroke-width: 2; fill: none; }
      .accent-green { stroke: #3fb950; stroke-width: 2; fill: none; }
      .accent-purple { stroke: #bc8cff; stroke-width: 2; fill: none; }
      .text-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; font-size: 18px; font-weight: 700; fill: #f0f6fc; }
      .text-subtitle { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; font-size: 13px; font-weight: 500; fill: #8b949e; }
      .text-badge { font-family: "JetBrains Mono", Consolas, monospace; font-size: 11px; font-weight: 600; }
      .text-body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; font-size: 12px; fill: #c9d1d9; }
      .text-mono { font-family: "JetBrains Mono", Consolas, monospace; font-size: 12px; fill: #79c0ff; }
      .arrow { stroke: #58a6ff; stroke-width: 1.5; fill: none; stroke-dasharray: 4,4; }
      .glow-green { filter: drop-shadow(0 0 6px rgba(63, 185, 80, 0.4)); }
      .glow-blue { filter: drop-shadow(0 0 6px rgba(88, 166, 255, 0.4)); }
    </style>
    <marker id="arrowhead-blue" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#58a6ff" />
    </marker>
    <marker id="arrowhead-green" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#3fb950" />
    </marker>
    <linearGradient id="grad-blue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#58a6ff" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#161b22" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="grad-green" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3fb950" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#161b22" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Background Canvas -->
  <rect width="1100" height="480" class="bg" rx="16" />
  <rect x="1" y="1" width="1098" height="478" fill="none" stroke="#30363d" stroke-width="1" rx="15" />

  <!-- Section 1: Agent Environment (Codex) -->
  <g transform="translate(40, 40)">
    <rect width="280" height="400" class="card" />
    <rect width="280" height="400" fill="url(#grad-blue)" rx="12" />
    <circle cx="28" cy="30" r="6" fill="#58a6ff" />
    <text x="44" y="35" class="text-title">Coding Agent</text>
    <text x="44" y="55" class="text-subtitle">Codex / LLM Runtime</text>

    <!-- Subcard: Stdio MCP Tools -->
    <g transform="translate(20, 80)">
      <rect width="240" height="135" class="subcard" />
      <text x="16" y="26" class="text-mono" font-weight="700">Model Context Protocol</text>
      <text x="16" y="44" class="text-subtitle">Standard Stdio Interface</text>
      
      <circle cx="22" cy="65" r="3" fill="#58a6ff"/>
      <text x="32" y="69" class="text-body">recent_context (last 72h)</text>
      
      <circle cx="22" cy="85" r="3" fill="#58a6ff"/>
      <text x="32" y="89" class="text-body">search_context (hybrid)</text>
      
      <circle cx="22" cy="105" r="3" fill="#58a6ff"/>
      <text x="32" y="109" class="text-body">log_update (tagged notes)</text>
      
      <circle cx="22" cy="125" r="3" fill="#58a6ff"/>
      <text x="32" y="129" class="text-body">open_session (UUID bind)</text>
    </g>

    <!-- Subcard: Lifecycle Hooks -->
    <g transform="translate(20, 235)">
      <rect width="240" height="145" class="subcard" />
      <text x="16" y="26" class="text-mono" font-weight="700">Codex Lifecycle Hooks</text>
      <text x="16" y="44" class="text-subtitle">Automatic Nonblocking Events</text>

      <rect x="16" y="58" width="90" height="22" rx="4" fill="#238636" fill-opacity="0.2" stroke="#238636" stroke-width="1"/>
      <text x="24" y="73" class="text-badge" fill="#3fb950">SessionStart</text>
      <text x="114" y="73" class="text-body">Bind UUID key</text>

      <rect x="16" y="88" width="55" height="22" rx="4" fill="#1f6feb" fill-opacity="0.2" stroke="#1f6feb" stroke-width="1"/>
      <text x="24" y="103" class="text-badge" fill="#58a6ff">Stop</text>
      <text x="78" y="103" class="text-body">Catch-up event</text>

      <rect x="16" y="118" width="85" height="22" rx="4" fill="#8957e5" fill-opacity="0.2" stroke="#8957e5" stroke-width="1"/>
      <text x="24" y="133" class="text-badge" fill="#bc8cff">SessionEnd</text>
      <text x="110" y="133" class="text-body">Final sync</text>
    </g>
  </g>

  <!-- Section 2: Core Daemon & Verification (blctxd) -->
  <g transform="translate(380, 40)">
    <rect width="340" height="400" class="card" />
    <circle cx="28" cy="30" r="6" fill="#3fb950" />
    <text x="44" y="35" class="text-title">Base Layer Context</text>
    <text x="44" y="55" class="text-subtitle">Private User-Session Daemon (blctxd)</text>

    <!-- Subcard: IPC & Coordinator -->
    <g transform="translate(20, 80)">
      <rect width="300" height="135" class="subcard" />
      <text x="16" y="26" class="text-mono" font-weight="700">Unix Socket IPC &amp; Coordinator</text>
      <text x="16" y="44" class="text-subtitle">daemon.sock • mode 0600 • systemd --user</text>

      <text x="16" y="72" class="text-body">• Single-writer exclusive process lock</text>
      <text x="16" y="92" class="text-body">• Parallel nonblocking read workers (WAL)</text>
      <text x="16" y="112" class="text-body">• Lexical search fallback during vector sync</text>
    </g>

    <!-- Subcard: Embedding Engine -->
    <g transform="translate(20, 235)">
      <rect width="300" height="145" class="subcard" />
      <text x="16" y="26" class="text-mono" font-weight="700">Local Vector Embeddings</text>
      <text x="16" y="44" class="text-subtitle">100% Offline CPU Inference</text>

      <rect x="16" y="58" width="130" height="22" rx="4" fill="#388bfd" fill-opacity="0.2" stroke="#388bfd" stroke-width="1"/>
      <text x="24" y="73" class="text-badge" fill="#79c0ff">BAAI/bge-small-en</text>
      <text x="154" y="73" class="text-body">384-dim CPU</text>

      <text x="16" y="103" class="text-body">• FastEmbed local ONNX runtime</text>
      <text x="16" y="123" class="text-body">• SHA-256 verified pinned model weights</text>
      <text x="16" y="143" class="text-body">• Zero external network requests</text>
    </g>
  </g>

  <!-- Section 3: Private Storage Layer -->
  <g transform="translate(780, 40)">
    <rect width="280" height="400" class="card" />
    <rect width="280" height="400" fill="url(#grad-green)" rx="12" />
    <circle cx="28" cy="30" r="6" fill="#d29922" />
    <text x="44" y="35" class="text-title">Private Local Storage</text>
    <text x="44" y="55" class="text-subtitle">~/.local/share/bl-context • mode 0700</text>

    <!-- Subcard: SQLite -->
    <g transform="translate(20, 80)">
      <rect width="240" height="135" class="subcard" />
      <text x="16" y="26" class="text-mono" font-weight="700">SQLite Database</text>
      <text x="16" y="44" class="text-subtitle">context.db • mode 0600</text>
      
      <text x="16" y="72" class="text-body">• Normalized turns &amp; messages</text>
      <text x="16" y="92" class="text-body">• Authored notes with #tags</text>
      <text x="16" y="112" class="text-body">• Cryptographic source checkpoints</text>
      <text x="16" y="132" class="text-body">• Exact timestamps &amp; provenance</text>
    </g>

    <!-- Subcard: Qdrant Vectors -->
    <g transform="translate(20, 235)">
      <rect width="240" height="145" class="subcard" />
      <text x="16" y="26" class="text-mono" font-weight="700">Qdrant Vector DB</text>
      <text x="16" y="44" class="text-subtitle">vectors/ • Embedded Storage</text>

      <text x="16" y="72" class="text-body">• 384-token chunk boundaries</text>
      <text x="16" y="92" class="text-body">• 48-token sliding context overlap</text>
      <text x="16" y="112" class="text-body">• Cosine similarity search</text>
      <text x="16" y="132" class="text-body">• Fully rebuildable from SQLite</text>
    </g>
  </g>

  <!-- Connection Arrows & Labels -->
  <!-- Agent to Daemon (MCP / Stdio) -->
  <path d="M 320 145 L 378 145" class="arrow" marker-end="url(#arrowhead-blue)" />
  <text x="330" y="138" class="text-badge" fill="#58a6ff">MCP</text>

  <!-- Agent to Daemon (Hooks) -->
  <path d="M 320 310 L 378 310" class="arrow" marker-end="url(#arrowhead-blue)" />
  <text x="325" y="303" class="text-badge" fill="#58a6ff">Events</text>

  <!-- Daemon to SQLite -->
  <path d="M 720 145 L 778 145" class="arrow" stroke="#3fb950" marker-end="url(#arrowhead-green)" />
  <text x="732" y="138" class="text-badge" fill="#3fb950">WAL</text>

  <!-- Daemon to Vectors -->
  <path d="M 720 310 L 778 310" class="arrow" stroke="#3fb950" marker-end="url(#arrowhead-green)" />
  <text x="730" y="303" class="text-badge" fill="#3fb950">Points</text>

</svg>
