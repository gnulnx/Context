<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" width="100%" height="100%">
  <defs>
    <style>
      .window-bg { fill: #0d1117; }
      .window-bar { fill: #161b22; stroke: #30363d; stroke-width: 1; }
      .window-border { stroke: #30363d; stroke-width: 1.5; fill: none; rx: 12px; }
      .text-code { font-family: "JetBrains Mono", Consolas, "Fira Code", monospace; font-size: 13px; fill: #c9d1d9; }
      .text-prompt { font-weight: 700; fill: #58a6ff; }
      .text-tool { fill: #d29922; font-style: italic; }
      .text-header { font-weight: 700; fill: #f0f6fc; }
      .text-citation { fill: #8b949e; font-size: 12px; }
      .text-success { fill: #3fb950; font-weight: 600; }
      .text-bullet { fill: #79c0ff; font-weight: 700; }
    </style>
  </defs>

  <!-- Terminal Window -->
  <rect width="960" height="460" class="window-bg" rx="12" />
  <rect width="960" height="38" class="window-bar" rx="12" />
  <!-- Crisp lower border for titlebar -->
  <line x1="0" y1="38" x2="960" y2="38" stroke="#30363d" stroke-width="1" />

  <!-- Window controls -->
  <circle cx="20" cy="19" r="6" fill="#ff5f56" />
  <circle cx="40" cy="19" r="6" fill="#ffbd2e" />
  <circle cx="60" cy="19" r="6" fill="#27c93f" />

  <!-- Window title -->
  <text x="480" y="24" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="12" font-weight="600" fill="#8b949e">Codex Interactive Shell — Base Layer Context</text>

  <!-- Terminal Content -->
  <g transform="translate(32, 70)">
    <!-- User Input -->
    <text x="0" y="0" class="text-code text-prompt">&gt; Summarize what we worked on over the last 3 days.</text>

    <!-- MCP Tool Execution Indicator -->
    <g transform="translate(0, 24)">
      <rect x="0" y="0" width="620" height="26" rx="6" fill="#21262d" stroke="#30363d" stroke-width="1" />
      <text x="12" y="17" class="text-code text-tool">⚡ [base-layer-context] Calling recent_context (last 72h across 874 sessions)...</text>
    </g>

    <!-- Agent Response -->
    <g transform="translate(0, 75)">
      <text x="0" y="0" class="text-code text-header">Here is the summary of recent development across 3 active sessions:</text>

      <!-- Bullet 1 -->
      <text x="0" y="32" class="text-code text-bullet">•</text>
      <text x="18" y="32" class="text-code"><tspan font-weight="700" fill="#f0f6fc">Dynamic Installer UX:</tspan> Added responsive TUI screens, centered layout, and live</text>
      <text x="18" y="52" class="text-code">model download progress bars. Fixed spinner lifecycle in PR #33.</text>

      <!-- Bullet 2 -->
      <text x="0" y="84" class="text-code text-bullet">•</text>
      <text x="18" y="84" class="text-code"><tspan font-weight="700" fill="#f0f6fc">Nonblocking History Queries:</tspan> Decoupled SQLite read queries from single-writer vector</text>
      <text x="18" y="104" class="text-code">reconciliation. Added lexical fallback during vector repair in PR #36.</text>

      <!-- Bullet 3 -->
      <text x="0" y="136" class="text-code text-bullet">•</text>
      <text x="18" y="136" class="text-code"><tspan font-weight="700" fill="#f0f6fc">Lifecycle Hooks Onboarding:</tspan> Integrated guided hook disclosure and made pending</text>
      <text x="18" y="156" class="text-code">hook approval a clean exit-0 success state in PR #35.</text>

      <!-- Provenance Box -->
      <g transform="translate(0, 195)">
        <rect x="0" y="0" width="896" height="42" rx="6" fill="#161b22" stroke="#238636" stroke-width="1" stroke-opacity="0.6" />
        <text x="16" y="26" class="text-code text-citation">
          <tspan fill="#3fb950" font-weight="700">✓ Strict Provenance:</tspan> Sessions <tspan fill="#79c0ff">01a090b0</tspan>, <tspan fill="#79c0ff">c354825f</tspan> • 254 messages indexed • 0 external API calls
        </text>
      </g>
    </g>
  </g>

  <!-- Outer Border -->
  <rect width="960" height="460" class="window-border" />
</svg>
