set -g default-terminal "tmux-256color"
set -g status off
set -g mouse on
set -g pane-border-status top
set -g pane-border-format " #[bold]#{?#{==:#{pane_index},0},SESSION 1 · TELL CODEX,FRESH SESSION · ASK AGAIN} "
set -g pane-border-style "fg=#484f58"
set -g pane-active-border-style "fg=#58a6ff"
set -g window-style "bg=#0d1117,fg=#c9d1d9"
set -g window-active-style "bg=#0d1117,fg=#c9d1d9"
set -g set-titles off
set -g allow-rename off
set -g default-shell /bin/bash
