[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "bl-context"
version = "0.0.9"
description = "Persistent context for coding agents"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["click>=8.1", "rich>=13", "requests>=2.32,<3", "qdrant-client[fastembed]==1.19.0", "fastembed==0.8.0", "mcp==1.30.0", "tomli>=2; python_version < '3.11'"]
authors = [
    { name = "Base Layer" },
]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]

[project.urls]
Homepage = "https://github.com/gnulnx/Context"
Repository = "https://github.com/gnulnx/Context"
Issues = "https://github.com/gnulnx/Context/issues"

[tool.setuptools.packages.find]
where = ["src"]

[project.scripts]
blctx = "bl_context.cli:main"
blctxd = "bl_context.daemon:main"
blctx-mcp = "bl_context.mcp_server:main"

[project.optional-dependencies]
dev = ["pytest>=8", "build", "twine", "ruff>=0.14,<0.15"]

[tool.ruff]
target-version = "py310"
extend-exclude = ["docs/.venv"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "PLC0415"]

[tool.setuptools.package-data]
bl_context = ["skills/*/SKILL.md"]
